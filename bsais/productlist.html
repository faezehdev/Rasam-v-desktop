<basis core="inlinesource" name="listP"  >
    <member name="list" lefttblcol="db.productList.id" righttblcol="db.productName.id" jointype="leftjoin" 
    format="join" type="list" ></member>
</basis>
<basis core="dbsource" name="db" source="basiscore" lid="1" mid="20" catid="[##cms.query.catid##]">
    <member name="productList" type="list" typeid="159"/> 
</basis>
<basis core="dbsource" source="basiscore" mid="20" name="db" lid="2">
   <member name="productCat" type="tree" request="cat" parentid="[##cms.query.catid##]"/> 
  </basis>
<basis core="dbsource" name="db" source="basiscore" lid="2" mid="20" catid="[##cms.query.catid##]">
    <member name="productName" type="list"/> 
</basis>
<basis core="dbsource" source="basiscore" mid="20" name="db" lid="1">
    <member name="productCat1" type="tree" request="cat" parentid="207940"/> 
   </basis>
   <basis core="dbsource" source="basiscore" name="db" lid="1" mid="20" >
	<member request="navcatid" type="tree" name="nav1" parentid="[##cms.query.catid##]" postsql="select * from [db.nav1]
    where parentcatid in ([##cms.query.catid##])" />
</basis>
<!DOCTYPE html>
<html lang="fa">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>[##cms.seo.title##]</title>
   <meta name="description" content="[##cms.seo.description##]" />
   <link rel="stylesheet" href="[##cms.cms.cdn##]/css/swiper.css">
   <link rel="stylesheet" href="[##cms.cms.cdn##]/css/main.css">
<script src="https://cdn.basiscore.net/academy.basiscore.com/_js/basiscore-2.23.1.min.js"></script>
<script src="https://cdn.basiscore.net/basispanel.ir/_js/alasql.min.js"></script>

</head>
<body>
   <basis core="call" file="header.inc" pageindex="[##cms.cms.pageindex##]" />
<main class="ProductList">
<section class="Banner sec-1">
   <img src="/images/banner-[##cms.query.catid##].jpg" alt="">
   <div class="Overlay">
       <basis core="print" datamembername="db.productCat">
           <layout>
               @child
           </layout>
           <face filter="catid=[##cms.query.catid##]">
               <h1>@title <span class="Colour">furniture</span></h1>
           </face>
       </basis>
       <div class="navigation">
        <a href="/" title="صفحه نخست" alt="صفحه نخست" class="nav">
            صفحه نخست 
        </a>
        <span class="nav">
            .
        </span>
                <a href="محصولات" title="محصولات" alt="محصولات " class="nav">
             محصولات
                </a>
        <span class="nav">
            .
        </span>
        <basis core="print" datamembername="db.nav1">
            <layout>
                @child
            </layout>
        
            <face filter="RowNumber=1">
                <span   class="nav">
                @title
                </span>
            </face>
        </basis>
    
      
       
               
    </div>
   </div>
</section>
<section class="ProLists-Container sec-2">
   <div class="ProductLists">
<basis core="print" datamembername="listP.list">
   <layout>
       @child
   </layout>
   <face>
       <div class="Product">
           <div class="OV"></div>
           <div class="wrapp">
               <div class="IMG">
                   <a href="@db.productList.link" alt="@db.productList.title" title="@db.productList.title">
                       <img src="@db.productList.type_159" alt="@db.productList.title" title="@db.productList.title">
                  
                   </a>
               </div>
               <div class="Text">
                   <div class="Title">
                       <a class="fn" href="@db.productList.link">

                       <span> @db.productList.title </span>
                       <!-- <span class="EN">مبلمان نئو کلاسیک</span> -->

                   </a>
                   <a class="en" href="@db.productList.link">

                    <span> @db.productName.title </span>
                    <!-- <span class="EN">مبلمان نئو کلاسیک</span> -->

                </a>
                   </div>
                   <div class="ShowMore">
                       <a href="@db.productList.link" alt="@db.productList.title" title="@db.productList.title">
                           Discover more
                           <span class="Arrow">
                               <svg width="48" height="25" viewBox="0 0 48 25" fill="none" xmlns="http://www.w3.org/2000/svg">
                                   <path fill-rule="evenodd" clip-rule="evenodd" d="M47.7826 12.9904V10.9375L4.41114 10.9375L15.0826 1.97347L13.7622 0.401532L0.931381 11.1794L0.0374298 11.9303L0.896622 12.7208L13.7274 24.5251L15.1174 23.0143L4.22186 12.9904L47.7826 12.9904Z" fill="#282828"/>
                                   </svg>
                                   
                           </span>
                       </a>
                   </div>
               </div>
           </div>
       </div>
   </face>
</basis>
        
   
   </div>
</section>
</main>
<basis core="call" file="footer.inc" pageindex="[##cms.cms.pageindex##]" />
<script src="[##cms.cms.cdn##]/_js/gsap.js"></script>
<script src="[##cms.cms.cdn##]/_js/scrollTrigger.js"></script>
<script src="[##cms.cms.cdn##]/_js/lenisScroll.js"></script>
<script src="[##cms.cms.cdn##]/js/config.js"></script>
<script src="[##cms.cms.cdn##]/_js/jquery/jquery-3.4.0.js"></script>
<script src="[##cms.cms.cdn##]/js/productList.js"></script>
</body>
</html>
